name: android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Persian Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned engine + apply port patches
        run: |
          chmod +x ../engine/fetch_upstream.sh
          ../engine/fetch_upstream.sh
          echo "GENERALS_ENGINE_ROOT=$GITHUB_WORKSPACE/engine/upstream" >> $GITHUB_ENV

      - name: Build (debug + release)
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Sign release with ephemeral keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ../build/keystore
          keytool -genkeypair -v \
            -keystore ../build/keystore/generals-release.jks \
            -alias generals -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$OBSI_KS_PASS" -keypass "$OBSI_KS_PASS" \
            -dname "CN=ObsiFox Generals Android, OU=Community, O=ObsiFox, L=Tehran, C=IR"
          # NOTE: GITHUB_ENV only affects LATER steps — export inline for this
          # step's gradle invocation (workaround documented per §35).
          export OBSI_KEYSTORE_PATH="$GITHUB_WORKSPACE/build/keystore/generals-release.jks"
          export OBSI_KEYSTORE_PASS="$OBSI_KS_PASS"
          export OBSI_KEY_ALIAS=generals
          export OBSI_KEY_PASS="$OBSI_KS_PASS"
          gradle --no-daemon :app:assembleRelease
        env:
          OBSI_KS_PASS: obsifox-generals-alpha

      - name: Collect APKs + checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ../build/apks
          cp app/build/outputs/apk/debug/app-debug.apk \
             ../build/apks/GeneralsAndroid-${{ github.ref_name }}-debug.apk
          RELEASE_APK=$(ls app/build/outputs/apk/release/ | grep -E '\.apk$' | head -1)
          echo "release artifact: $RELEASE_APK"
          cp "app/build/outputs/apk/release/$RELEASE_APK" \
             ../build/apks/GeneralsAndroid-${{ github.ref_name }}-release.apk
          cd ../build/apks && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload build artifacts (every push)
        uses: actions/upload-artifact@v4
        with:
          name: generals-android-apk
          path: |
            source/app/build/outputs/apk/debug/*.apk
            source/app/build/outputs/apk/release/*.apk

      - name: GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apks/*.apk
            build/apks/SHA256SUMS.txt
          body: |
            **Generals Android — Persian Port (${{ github.ref_name }})**
            - فایل‌های بازی را باید خودتان وارد کنید → docs/GAME-FILES.md
            - مالتی‌پلیر هات‌اسپات فعلاً شامل لابی واقعی است؛ اتصال به موتور در فاز ۱۶
            - سورس: obsifox/GeneralsAndroid-Source
          fail_on_unmatched_files: true
